name: 💡 Feature Request
description: Suggest an idea or new challenge for WakeWalk
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make mornings even more disciplined? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the difficulty or pain point is.
      placeholder: "I find it hard to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've thought about.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any mockups, screenshots, or context about the feature.
