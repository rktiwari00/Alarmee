name: 🐛 Bug Report
description: Create a report to help us fix a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help reproduce the problem.
  - type: input
    id: device
    attributes:
      label: Device Model & Manufacturer
      description: e.g. Samsung Galaxy S23, Xiaomi 13 Pro, Google Pixel 8
      placeholder: e.g. Google Pixel 8
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android Version
      description: e.g. Android 14 (One UI 6.0), Android 15 Beta, Android 13
      placeholder: e.g. Android 14
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: WakeWalk Version
      description: Check under Settings tab in app
      placeholder: e.g. v1.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: What steps did you take before the issue occurred?
      placeholder: |
        1. Set alarm for 07:00 AM with Walk challenge (150 steps)
        2. Lock phone and leave overnight
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: If applicable, attach logs from logcat or screenshots.
